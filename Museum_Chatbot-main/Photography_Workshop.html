<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Sculptures Exhibition - Booking Form</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
    background-color: #f5f5f5;
}

h2 {
    color: #333;
}

form {
    display: flex;
    flex-direction: column;
    width: 300px;
}

label {
    margin-top: 10px;
    color: #333;
}

input[type="text"], input[type="email"], input[type="password"], input[type="number"] {
    padding: 8px;
    margin-top: 5px;
}

button {
    margin-top: 15px;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

    </style>
</head>
<body>
    <h2>Book Tickets Photography Workshop</h2>
    <form id="bookingForm" action="/submitBooking" method="POST">
        <input type="hidden" name="eventName" value="Photography Workshop">

        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" required>
        
        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets" required>
        
        <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
